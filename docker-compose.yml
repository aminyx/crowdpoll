# One-command demo: app + Postgres (schema applied from drizzle/ on first boot).
#   docker compose up --build
# Then open http://localhost:3000

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://crowdpoll:crowdpoll@db:5432/crowdpoll
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-demo-only-secret-change-me-please}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crowdpoll
      POSTGRES_PASSWORD: crowdpoll
      POSTGRES_DB: crowdpoll
    volumes:
      - ./drizzle/0000_init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdpoll"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
